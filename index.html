<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Zeroed — A browser round-based Zombies FPS game." />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
  <title>Zeroed</title>
</head>

<body>
<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="icon-health" viewBox="0 0 24 24"><path d="M12 20 3 11C-1 3 8 1 12 7c4-6 13-4 9 4Z"/><path d="M4 12h4l2-4 3 8 2-4h5"/></symbol>
<symbol id="icon-kills" viewBox="0 0 24 24"><path d="M7 18v3h10v-3c7-5 4-15-5-15S0 13 7 18Z"/><circle cx="8" cy="11" r="1"/><circle cx="16" cy="11" r="1"/><path d="m10 16 2-2 2 2m-2 2v3"/></symbol>
<symbol id="icon-headshots" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 1v6m0 10v6M1 12h6m10 0h6"/></symbol>
<symbol id="icon-round" viewBox="0 0 24 24"><path d="M5 4v16M9.5 4v16M14 4v16M18.5 4v16M2 17 22 7"/></symbol>
</defs></svg>
  <div id="app"></div>

  <div id="hud" class="hidden">
    <div id="crosshair">
      <span class="arm arm-top"></span>
      <span class="arm arm-right"></span>
      <span class="arm arm-bottom"></span>
      <span class="arm arm-left"></span>
    </div>
    <div id="scope-overlay"></div>
    <div id="hitmarker">
      <span></span><span></span><span></span><span></span>
    </div>

    <div id="touch-controls" data-i18n-aria-label="touch.controls">
      <!-- Floating joystick visual: appears where the left-zone finger lands. -->
      <div id="joystick">
        <div id="joystick-knob"></div>
      </div>
      <!-- Secondary actions: small, out of the aiming thumb's way. -->
      <div class="touch-secondary">
        <button type="button" data-action="reload" id="btn-reload" data-i18n-aria-label="touch.reloadLabel" data-i18n="touch.reload"></button>
        <button type="button" data-action="interact" id="btn-interact" data-i18n-aria-label="touch.useLabel" data-i18n="touch.use"></button>
        <button type="button" data-action="swap-weapon" id="btn-weapon" data-i18n-aria-label="touch.weaponLabel" data-i18n="touch.weapon"></button>
        <button type="button" data-action="knife" id="btn-knife" data-i18n-aria-label="touch.knifeLabel" data-i18n="touch.knife"></button>
        <button type="button" data-action="pause" id="btn-pause" data-i18n-aria-label="touch.pauseLabel">| |</button>
      </div>
      <!-- Primary actions: right thumb rest position. -->
      <div class="touch-primary">
        <button type="button" data-action="fire" id="btn-fire" data-i18n-aria-label="touch.fireLabel" data-i18n="touch.fire"></button>
      </div>
    </div>

    <div id="hud-weapon" class="hud-panel">
      <div id="hud-weapon-name">M4A1</div>
      <div id="hud-ammo">30 / ∞</div>
      <div class="hud-row hud-row-secondary"><span class="hud-label" data-i18n="hud.mode"></span><span id="hud-mode">AUTO</span></div>
    </div>

    <div id="hud-zombies" class="hud-panel hidden">
      <div class="survival-top"><div><span class="survival-label" data-i18n="hud.round"></span><div id="z-round"></div></div>
        <div class="points-counter"><strong id="z-points" data-i18n-aria-label="hud.points">0</strong></div></div>
      <div id="z-health"><div class="health-heading"><span><svg class="survival-icon" aria-hidden="true"><use href="#icon-health"/></svg> <span data-i18n="hud.health"></span></span><strong id="z-hp">100 / 100</strong></div>
        <div id="z-hp-bar"><span id="z-hp-fill"></span></div></div>
      <div class="survival-counters"><div><svg class="survival-icon" aria-hidden="true"><use href="#icon-kills"/></svg><span data-i18n="hud.kills"></span><strong id="z-kills">0</strong></div>
        <div><svg class="survival-icon" aria-hidden="true"><use href="#icon-headshots"/></svg><span data-i18n="hud.headshots"></span><strong id="z-headshots">0</strong></div></div>
      <div id="z-lamps" class="lamp-progress"></div>
    </div>

    <div id="round-banner">
      <div id="banner-title"></div>
      <div id="banner-sub"></div>
    </div>
    <div id="damage-overlay"></div>
    <div id="interact-prompt" class="hidden"></div>
    <div id="downed-filter" class="hidden"></div>
    <div id="downed-status" class="hidden" role="status"><strong data-i18n="hud.downed"></strong><span id="downed-countdown"></span></div>
    <div id="revive-status" class="hidden"><span data-i18n="hud.revivingTeammate"></span><div><i id="revive-progress"></i></div></div>
    <div id="host-pause-status" class="hidden" role="status" data-i18n="hud.hostPaused"></div>
  </div>

  <div id="map-select" class="hidden">
    <div class="start-panel">
      <h1 class="zeroed-title">ZEROED</h1>
      <p class="mode-hint" data-i18n="menu.tagline"></p>
      <div class="mode-grid" role="group" data-i18n-aria-label="menu.zombies">
        <button type="button" data-map="burned-mansion">
          <span class="mode-name" data-i18n="menu.zombies"></span>
          <span class="mode-desc">BURNED MANSION</span>
        </button>
      </div>
      <button type="button" id="coop-select" class="coop-select" data-i18n="menu.multiplayer"></button>
      <div id="language-select" class="language-select" role="group" data-i18n-aria-label="menu.language">
        <span class="language-label" data-i18n="menu.language" aria-hidden="true"></span>
        <button type="button" data-language="es" lang="es">ES</button>
        <button type="button" data-language="en" lang="en">EN</button>
        <button type="button" data-language="ca" lang="ca">CA</button>
      </div>
      <button type="button" id="privacy-open" class="privacy-link" data-i18n="menu.privacy"></button>
      <div class="pwa-actions" aria-live="polite">
        <button type="button" id="pwa-install" class="pwa-action hidden" data-i18n="menu.install"></button>
        <button type="button" id="pwa-update-menu" class="pwa-action hidden" data-i18n="menu.update"></button>
      </div>
      <p id="ios-install-hint" class="ios-install-hint hidden" data-i18n="menu.iosHint"></p>
    </div>
  </div>

  <dialog id="privacy-dialog" aria-labelledby="privacy-title">
    <div class="privacy-dialog-header">
      <h2 id="privacy-title" data-i18n="privacy.title"></h2>
      <button type="button" id="privacy-close" data-i18n-aria-label="privacy.closeLabel" data-i18n="privacy.close"></button>
    </div>
    <iframe id="privacy-frame" data-i18n-title="privacy.frameTitle"></iframe>
  </dialog>

  <div id="coop-lobby" class="hidden">
    <div class="coop-lobby-content">
      <button type="button" id="coop-back" data-i18n-title="coop.back">
        <span aria-hidden="true">←</span> <span data-i18n="coop.back"></span>
      </button>
      <div class="start-panel">
        <h1 data-i18n="coop.title"></h1>
        <p class="mode-hint" data-i18n="coop.subtitle"></p>
        <div class="coop-actions">
          <button type="button" id="coop-host" data-i18n="coop.create"></button>
          <button type="button" id="coop-join" data-i18n="coop.join"></button>
        </div>
        <div id="coop-join-fields" class="coop-join-fields hidden">
          <label for="coop-code" data-i18n="coop.codeLabel"></label>
          <input id="coop-code" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123" />
          <button type="button" id="coop-join-submit" data-i18n="coop.connect"></button>
        </div>
        <p id="coop-status" role="status" aria-live="polite"></p>
        <div id="coop-room-share" class="coop-room-share hidden">
          <span id="coop-room-code" class="coop-room-code"></span>
          <button type="button" id="coop-copy-code"></button>
          <button type="button" id="coop-share-code" data-i18n="coop.share"></button>
        </div>
        <details id="coop-connection-options" class="hidden">
          <summary data-i18n="coop.connectionOptions"></summary>
          <div class="coop-server-field">
            <label for="coop-server" data-i18n="coop.server"></label>
            <input id="coop-server" type="url" spellcheck="false" placeholder="wss://your-server.example" />
            <p data-i18n="coop.serverHint"></p>
          </div>
        </details>
      </div>
    </div>
  </div>

  <div id="game-over" class="hidden" role="alertdialog" aria-labelledby="go-title" aria-describedby="go-epitaph">
    <div class="go-flash" aria-hidden="true"></div>
    <div class="start-panel">
      <svg class="go-flatline" viewBox="0 0 440 36" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M0 18h150l6-8 6 8h10l5-15 8 30 6-19 5 4h244"/></svg>
      <p class="menu-kicker" data-i18n="gameOver.kicker"></p>
      <h1 id="go-title" data-i18n="gameOver.title"></h1>
      <p id="go-epitaph"></p>
      <dl class="go-stats">
        <div><dt><svg class="survival-icon" aria-hidden="true"><use href="#icon-round"/></svg><span data-i18n="gameOver.round"></span></dt><dd id="go-round">1</dd></div>
        <div><dt><svg class="survival-icon" aria-hidden="true"><use href="#icon-kills"/></svg><span data-i18n="gameOver.kills"></span></dt><dd id="go-kills">0</dd></div>
        <div><dt><svg class="survival-icon" aria-hidden="true"><use href="#icon-headshots"/></svg><span data-i18n="gameOver.headshots"></span></dt><dd id="go-headshots">0</dd></div>
      </dl>
      <button type="button" id="go-restart"></button>
    </div>
  </div>

  <div id="pause-menu" class="hidden">
    <div class="start-panel">
      <p class="menu-kicker"><span data-i18n="pause.kicker"></span> <span id="pause-round">1</span></p>
      <h1 data-i18n="pause.title"></h1>
      <dl class="pause-stats" data-i18n-aria-label="pause.stats">
        <div><dt data-i18n="pause.damage"></dt><dd id="pause-damage">0</dd></div>
        <div><dt data-i18n="pause.points"></dt><dd id="pause-points">0</dd></div>
        <div><dt data-i18n="pause.kills"></dt><dd id="pause-kills">0</dd></div>
        <div><dt data-i18n="pause.headshots"></dt><dd id="pause-headshots">0</dd></div>
      </dl>
      <div id="pause-lamps" class="lamp-progress"></div>
      <div class="pause-actions">
        <button type="button" id="pause-resume" data-i18n="pause.resume"></button>
        <button type="button" id="pause-restart" data-i18n="pause.restart"></button>
        <button type="button" id="pause-menu-btn" data-i18n="pause.mainMenu"></button>
        <button type="button" id="pwa-update-pause" class="hidden" data-i18n="menu.update"></button>
      </div>
    </div>
  </div>

  <div id="ending-screen" class="hidden" aria-live="polite">
    <div class="ending-cinematic" aria-hidden="true">
      <div class="ending-world">
        <div class="ending-sky"></div>
        <div class="ending-horizon"></div>
        <div class="ending-mushroom">
          <div class="mushroom-stem"></div>
          <div class="mushroom-ring"></div>
          <div class="mushroom-cap"></div>
        </div>
        <div class="ending-fireball"></div>
        <svg class="ending-ruins" viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice">
          <path d="M0 300V224C140 214 260 222 380 216S620 212 760 218S1060 226 1200 216S1460 210 1600 220V300Z
            M310 222V138H730V222Z M296 140L370 78L444 140Z M340 104V60H356V90Z
            M470 140V92H572V140Z M458 94L521 26L584 94Z M518 32V6L524 12V32Z
            M590 140L622 104L648 118L664 96L700 112L744 140Z M680 116V70H694V122Z" />
          <path class="ruin-branches" d="M1200 222L1198 140L1186 96M1198 150L1222 110L1240 100M1222 110L1218 82M1192 124L1168 104
            M118 224L122 150L104 112M121 166L146 128L162 122M146 128L144 104M108 132L88 120
            M1430 220L1428 172L1416 150M1428 180L1446 158M760 218V194M792 219V198M824 220V192M856 220V200M752 204L870 206" />
          <path class="ruin-windows" d="M330 160h18v22h-18Z M370 160h18v22h-18Z M410 160h18v22h-18Z
            M600 160h18v22h-18Z M640 160h18v22h-18Z M684 160h18v22h-18Z M330 192h18v20h-18Z M684 192h18v20h-18Z
            M506 128v-14a15 15 0 0 1 30 0v14Z" />
        </svg>
        <div class="ending-shockwave"></div>
        <div class="ending-dustwall"></div>
        <div class="ending-dim"></div>
      </div>
      <div class="ending-alarm"></div>
      <div class="ending-ash"></div>
      <div class="ending-flash"></div>
      <div class="ending-grain"></div>
      <div class="ending-letterbox"></div>
    </div>
    <div class="nuclear-alert">
      <svg class="nuclear-symbol" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M44 39.61L27 10.16A46 46 0 0 1 73 10.16L56 39.61A12 12 0 0 0 44 39.61Z
          M62 50L96 50A46 46 0 0 1 73 89.84L56 60.39A12 12 0 0 0 62 50Z
          M44 60.39L27 89.84A46 46 0 0 1 4 50L38 50A12 12 0 0 0 44 60.39Z" />
        <circle cx="50" cy="50" r="8" />
      </svg>
      <p data-i18n="ending.nuclear"></p>
      <div class="nuclear-countdown" aria-hidden="true"><span>3</span><span>2</span><span>1</span></div>
    </div>
    <div class="credits-panel">
      <h1>ZEROED</h1>
      <p class="credits-round"><span data-i18n="ending.round"></span> <span id="ending-round">1</span></p>
      <p class="credits-role" data-i18n="ending.designedBy"></p>
      <p>Gabriel Borràs (Biel40)</p>
      <p class="credits-role" data-i18n="ending.betaTesters"></p>
      <p>Biel Frau Fuster<br />Ivan Cabellos Berber</p>
      <p class="credits-thanks" data-i18n="ending.thanks"></p>
      <button type="button" id="credits-main-menu" data-i18n="ending.mainMenu"></button>
    </div>
  </div>

  <div id="start-screen">
    <div id="rotate-prompt" role="status" data-i18n-aria-label="start.rotateLabel">
      <div class="rotate-art" aria-hidden="true">
        <span class="rotate-orbit"></span>
        <span class="rotate-phone"><span></span></span>
      </div>
      <div class="rotate-copy"><strong><span data-i18n="start.rotateTitle1"></span><br /><span data-i18n="start.rotateTitle2"></span></strong><span data-i18n="start.rotateHint"></span></div>
    </div>
    <div class="start-panel">
      <h1>Zeroed</h1>
      <p id="start-hint" data-i18n="start.loading"></p>
      <div id="loading-bar"><span></span></div>
      <div class="controls-grid">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span data-i18n="controls.move"></span>
        <span><kbd data-i18n="controls.mouse"></kbd></span><span data-i18n="controls.aim"></span>
        <span><kbd data-i18n="controls.lmb"></kbd></span><span data-i18n="controls.fire"></span>
        <span><kbd data-i18n="controls.rmb"></kbd></span><span data-i18n="controls.ads"></span>
        <span><kbd>R</kbd></span><span data-i18n="controls.reload"></span>
        <span data-coop-hidden><kbd>X</kbd></span><span data-coop-hidden data-i18n="controls.fireMode"></span>
        <span><kbd>E</kbd></span><span data-i18n="controls.interact"></span>
        <span data-coop-hidden><kbd>3</kbd> / <kbd>NUM 3</kbd></span><span data-coop-hidden data-i18n="controls.knife"></span>
        <span><kbd data-i18n="controls.space"></kbd></span><span data-i18n="controls.jump"></span>
        <span><kbd>1</kbd>–<kbd>2</kbd></span><span data-i18n="controls.slots"></span>
        <span><kbd>ESC</kbd></span><span data-i18n="controls.release"></span>
      </div>
    </div>
  </div>

  <div id="map-loading" class="hidden" role="status" aria-live="polite">
    <div class="map-loading-content">
      <p class="map-loading-kicker" data-i18n="mapLoading.preparing"></p>
      <h2 class="map-loading-title">BURNED MANSION</h2>
      <div class="map-loading-bar" aria-hidden="true"><span></span></div>
      <p class="map-loading-tagline" data-i18n="menu.tagline"></p>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
