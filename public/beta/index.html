<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b0e12">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Zeroed | Beta cerrada</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: #0b0e12; color: #f4f5f6; font: 16px/1.6 'Segoe UI', system-ui, sans-serif; }
    main { min-height: 100dvh; display: grid; place-content: center; padding: 32px 24px; }
    section { width: min(100%, 420px); margin: auto; }
    .brand { display: flex; gap: 14px; align-items: center; }
    .brand img { width: 48px; height: 48px; }
    h1 { font-size: 40px; line-height: 1.2; margin: 0; }
    .status { display: flex; align-items: center; gap: 10px; color: #f0c95a; margin: 32px 0 12px; }
    .status svg { width: 24px; height: 24px; flex-shrink: 0; }
    h2 { font-size: 23px; line-height: 1.3; margin: 0 0 12px; }
    p { color: #b6bec7; margin: 0 0 24px; }
    label { display: block; margin-bottom: 8px; }
    input { width: 100%; min-width: 0; padding: 12px; font: inherit; color: #f4f5f6; border: 1px solid #56606b; border-radius: 4px; background: #141a20; }
    button, .back { padding: 12px 16px; font: inherit; border-radius: 4px; text-align: center; cursor: pointer; }
    button { width: 100%; margin-top: 16px; background: #d6ef7e; color: #172008; border: 0; font-weight: 600; }
    .back { display: block; color: #c5ced8; margin-top: 8px; border: 1px solid #56606b; text-decoration: none; }
    :focus-visible { outline: 3px solid #d6ef7e; outline-offset: 3px; }
    #message { margin: 20px 0 0; min-height: 3.2em; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
    footer { margin-top: 24px; font-size: 13px; color: #8995a2; }
    footer a { color: inherit; }
    #snackbar { position: fixed; z-index: 20; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); display: flex; gap: 16px; align-items: center; padding: 14px 16px; background: #242a31; border: 1px solid #dc8b83; border-radius: 4px; box-shadow: 0 8px 24px #0006; }
    #snackbar-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    #snackbar-close { flex: 0 0 32px; width: 32px; height: 32px; padding: 0; margin: 0; background: transparent; color: #f4f5f6; font-size: 24px; font-weight: 400; }
  </style>
</head>
<body>
  <main>
    <section aria-labelledby="title">
      <div class="brand"><img src="/favicon.svg" alt="" width="48" height="48"><h1 id="title">Zeroed</h1></div>
      <div class="status">
        <!-- Wrench icon from Lucide (ISC license). -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/></svg>
        <span>En mantenimiento</span>
      </div>
      <h2>Beta cerrada</h2>
      <p>Estamos preparando la pr&oacute;xima versi&oacute;n. El acceso est&aacute; reservado únicamente a los participantes de la beta cerrada.</p>
      <form id="access-form">
        <label for="email">Tu correo electr&oacute;nico</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <button id="continue" type="submit">Continuar</button>
      </form>
      <a id="request" class="back" hidden>Solicitar acceso a la beta</a>
      <button id="change" type="button" hidden>Usar otro correo</button>
      <a class="back" href="about:blank">Salir</a>
      <p id="message" role="status" aria-live="polite"></p>
      <footer>El acceso se recuerda en esta pesta&ntilde;a. <a href="/privacy.html">Privacidad</a></footer>
    </section>
  </main>
  <div id="snackbar" hidden>
    <span id="snackbar-text" role="alert" aria-atomic="true"></span>
    <button id="snackbar-close" type="button" aria-label="Cerrar aviso" title="Cerrar aviso">&times;</button>
  </div>
  <script type="module">
    import { acceptBetaEmail, hasBetaAccess } from './access.js';
    const form = document.getElementById('access-form');
    const email = document.getElementById('email');
    const requestButton = document.getElementById('request');
    const changeButton = document.getElementById('change');
    const message = document.getElementById('message');
    const snackbar = document.getElementById('snackbar');
    const snackbarText = document.getElementById('snackbar-text');
    let snackbarTimer;

    function hideSnackbar() {
      clearTimeout(snackbarTimer);
      snackbar.hidden = true;
      snackbarText.textContent = '';
    }

    function showSnackbar(text) {
      hideSnackbar();
      snackbar.hidden = false;
      snackbarText.textContent = text;
      snackbarTimer = setTimeout(hideSnackbar, 8000);
    }
    document.getElementById('snackbar-close').addEventListener('click', hideSnackbar);

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      hideSnackbar();
      try {
        const address = email.value.trim();
        if (acceptBetaEmail(address)) {
          location.replace(`/${location.search}`);
          return;
        }
        form.hidden = true;
        changeButton.hidden = false;
        requestButton.href = `mailto:biel40aws@gmail.com?subject=${encodeURIComponent('Acceso a la beta de Zeroed')}&body=${encodeURIComponent(`Me gustaria solicitar acceso a la beta cerrada.\n\nMi correo: ${address}`)}`;
        requestButton.hidden = false;
        message.textContent = 'Este correo todav\u00eda no tiene acceso. Puedes solicitar una invitaci\u00f3n a la beta cerrada.';
      } catch {
        showSnackbar('No se puede recordar el acceso en esta pesta\u00f1a. Permite el almacenamiento del sitio y vuelve a intentarlo.');
      }
    });
    changeButton.addEventListener('click', () => {
      form.hidden = false;
      requestButton.hidden = true;
      changeButton.hidden = true;
      message.textContent = '';
      hideSnackbar();
      email.focus();
    });

    async function clearOfflineCache() {
      // Retire the offline shell before entering the closed beta.
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }
      if ('caches' in window) {
        const names = await caches.keys();
        await Promise.all(names.filter((name) => name.startsWith('zeroed') || name.startsWith('workbox-precache')).map((name) => caches.delete(name)));
      }
    }
    void clearOfflineCache().catch(() => {});
    if (hasBetaAccess()) location.replace(`/${location.search}`);
  </script>
</body>
</html>
